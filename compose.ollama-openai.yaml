services:
  ollama-openai:
    image: ghcr.io/eyalrot/ollama_openai:latest
    restart: unless-stopped
    environment:
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL:?set OPENAI_API_BASE_URL in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-dummy}
      PROXY_PORT: "11434"
      REQUEST_TIMEOUT: ${OLLAMA_OPENAI_REQUEST_TIMEOUT:-600}
      MAX_RETRIES: ${OLLAMA_OPENAI_MAX_RETRIES:-1}
    expose:
      - "11434"